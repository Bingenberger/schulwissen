# Schulwissen-Plattform – Betrieb mit Docker Compose.
#
#   cp .env.example .env      # SW_SECRET_KEY und POSTGRES_PASSWORD setzen
#   docker compose build
#   docker compose run --rm app python manage.py platform_migrate
#   docker compose up -d
#   docker compose exec app python manage.py admin_anlegen deine@adresse.de
#
# Die App lauscht nur auf 127.0.0.1 – davor gehört nginx mit HTTPS
# (Beispiel: deploy/nginx-schulwissen.conf). Details: DEPLOYMENT.md.

services:
  db:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_DB: schulwissen
      POSTGRES_USER: schulwissen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - pgdaten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schulwissen -d schulwissen"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: schulwissen:0.1.0-dev
    restart: unless-stopped
    env_file: .env
    environment:
      # Überschreibt .env: im Compose-Netz heißt die Datenbank „db".
      SW_DATABASE_URL: postgresql://schulwissen:${POSTGRES_PASSWORD}@db:5432/schulwissen
      SW_MEDIEN_VERZEICHNIS: /medien
      # X-Forwarded-For nur von nginx glauben. „*" ist unbedenklich, solange der
      # Port auf 127.0.0.1 liegt. Wird der Port geöffnet, MUSS hier die Adresse
      # des Proxys stehen (SW_PROXY_IPS).
      FORWARDED_ALLOW_IPS: "${SW_PROXY_IPS:-127.0.0.1}"
      SW_WORKER: "${SW_WORKER:-2}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    volumes:
      - medien:/medien
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Nur auf 127.0.0.1 – nach draußen geht es über nginx (DEPLOYMENT.md).
      # SW_PORT ändern, wenn auf dem Server schon etwas auf diesem Port läuft:
      # die Fahrradprüfungs-App belegt zum Beispiel 8000.
      - "127.0.0.1:${SW_PORT:-8001}:8000"

volumes:
  pgdaten:
  medien:
