{% if seite.paginator.num_pages > 1 %}<nav class="seitennavigation knopf-reihe" aria-label="Weitere Seiten">{% if seite.has_previous %}<a class="knopf" href="{% querystring seite=seite.previous_page_number %}">Vorherige Seite</a>{% endif %}<span class="leise klein">Seite {{ seite.number }} von {{ seite.paginator.num_pages }}</span>{% if seite.has_next %}<a class="knopf" href="{% querystring seite=seite.next_page_number %}">Nächste Seite</a>{% endif %}</nav>{% endif %}
