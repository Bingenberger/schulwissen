[project]
name = "schulwissen"
version = "0.1.0"
description = "Schulwissen-Plattform der GGS Niederkassel"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6.0",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "nh3>=0.2.20",
    "openpyxl>=3.1.5",
    # Volltext aus Anhaengen (SPEC.md Paragraf 9)
    "pypdf>=5.1",
    "python-docx>=1.1",
    "odfpy>=1.4.1",
    # Nextcloud ueber WebDAV (SPEC.md Paragraf 10, Stufe 1)
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "schulwissen.einstellungen"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]

[tool.uv]
package = false
