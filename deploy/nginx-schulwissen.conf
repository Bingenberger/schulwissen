# nginx für die Schulwissen-Plattform.
#
#   sudo cp deploy/nginx-schulwissen.conf /etc/nginx/sites-available/schulwissen
#   sudo nano /etc/nginx/sites-available/schulwissen     # Domain eintragen
#   sudo ln -s /etc/nginx/sites-available/schulwissen /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d schulwissen.ggs-ndk.de
#
# certbot trägt den HTTPS-Teil selbst nach.

server {
    listen 80;
    listen [::]:80;
    server_name schulwissen.ggs-ndk.de;

    # Anhänge dürfen so groß sein wie in der App erlaubt (50 MB).
    client_max_body_size 52m;

    # Hochgeladene Anhänge liefert nginx direkt aus. Der Pfad ist das
    # Docker-Volume „medien" – siehe DEPLOYMENT.md, Abschnitt Dateien.
    location /medien/ {
        alias /var/lib/docker/volumes/schulwissen_medien/_data/;
        expires 7d;
        add_header Cache-Control "private";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Ohne diesen Header hält Django jede Anfrage für unverschlüsselt und
        # baut die Links in den Passwort-Mails mit http:// zusammen.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
